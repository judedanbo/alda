apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adla-app
  labels:
    app.kubernetes.io/name: adla-app
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adla-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
