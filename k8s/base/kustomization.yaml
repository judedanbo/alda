apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: adla
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true

resources:
  - namespace.yaml
  - configmap.yaml
  - limit-range.yaml
  - resource-quota.yaml
  - statefulset-postgres.yaml
  - statefulset-redis.yaml
  - statefulset-minio.yaml
  - deployment-app.yaml
  - deployment-worker.yaml
  - service-app.yaml
  - hpa-app.yaml
  - ingress.yaml
  - network-policy.yaml
  # migration-job.yaml and minio-init-job.yaml are intentionally NOT listed:
  # Jobs are immutable and the overlay is applied more than once per deploy.
  # The migration runs as a uniquely-named per-run Job from deploy.yml; the
  # MinIO bucket is created lazily by the app (storage.service.ts ensureBucket).
