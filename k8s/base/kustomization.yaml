apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: adla
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true

resources:
  - configmap.yaml
  - statefulset-postgres.yaml
  - statefulset-redis.yaml
  - statefulset-minio.yaml
  - deployment-app.yaml
  - deployment-worker.yaml
  - service-app.yaml
  - hpa-app.yaml
  - ingress.yaml
  - network-policy.yaml
  # Intentionally NOT listed here:
  # - namespace.yaml / resource-quota.yaml / limit-range.yaml: cluster-scoped or
  #   cluster-policy objects applied once at bootstrap by a cluster admin. The
  #   deploy pipeline runs with a NAMESPACE-SCOPED identity (least privilege) and
  #   cannot create a Namespace or write ResourceQuota/LimitRange.
  # - migration-job.yaml / minio-init-job.yaml: Jobs are immutable and the overlay
  #   is applied more than once per deploy. Migration runs as a uniquely-named
  #   per-run Job from deploy.yml; the MinIO bucket is created lazily by the app
  #   (storage.service.ts ensureBucket).
