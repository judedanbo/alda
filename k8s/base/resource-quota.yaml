# Bootstrap-managed (NOT in kustomization). Applied once per namespace by a
# cluster admin: `kubectl apply -n <ns> -f k8s/base/resource-quota.yaml`.
# ResourceQuota is a platform guardrail; the namespace-scoped deploy identity
# (K8s `admin` / Azure "RBAC Admin") cannot write it by design.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: adla-quota
  labels:
    app.kubernetes.io/part-of: adla
    app.kubernetes.io/component: infra
spec:
  hard:
    # headroom for the in-cluster data tier (postgres/redis/minio) plus the
    # app/worker pods and HPA scale-up
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "12"
    limits.memory: 20Gi
    pods: "20"
    services: "8"
