apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adla-postgres
  labels:
    app.kubernetes.io/name: adla-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: adla-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adla-postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adla-postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        # postgres:16-alpine runs as uid 70; let the kubelet chown the PVC for it
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              protocol: TCP
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: adla-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adla-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: adla-secrets
                  key: POSTGRES_DB
            # subdir keeps the Azure Disk lost+found out of the data directory
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: managed-csi
        resources:
          requests:
            storage: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: adla-postgres
  labels:
    app.kubernetes.io/name: adla-postgres
    app.kubernetes.io/component: database
spec:
  # headless service — stable DNS name adla-postgres for the single replica
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: adla-postgres
    app.kubernetes.io/component: database
