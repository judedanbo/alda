apiVersion: batch/v1
kind: Job
metadata:
  name: adla-migrate
  labels:
    app.kubernetes.io/name: adla-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adla-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: regisry.azurecr.io/adla-migrate:latest
          envFrom:
            - secretRef:
                name: adla-secrets
          resources:
            requests:
              cpu: 128m
              memory: 256Mi
            limits:
              cpu: 256m
              memory: 512Mi
