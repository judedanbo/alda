apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adla-minio
  labels:
    app.kubernetes.io/name: adla-minio
    app.kubernetes.io/component: storage
spec:
  serviceName: adla-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adla-minio
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adla-minio
        app.kubernetes.io/component: storage
    spec:
      containers:
        - name: minio
          # pinned release for reproducible behaviour (avoid :latest drift)
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              protocol: TCP
              name: s3
            - containerPort: 9001
              protocol: TCP
              name: console
          env:
            # root creds reuse the SAME values the app authenticates with,
            # so MinIO and the app can never drift apart
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: adla-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adla-secrets
                  key: MINIO_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: managed-csi
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: adla-minio
  labels:
    app.kubernetes.io/name: adla-minio
    app.kubernetes.io/component: storage
spec:
  # regular ClusterIP — the app dials adla-minio:9000 over the S3 API
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: s3
    - port: 9001
      targetPort: 9001
      protocol: TCP
      name: console
  selector:
    app.kubernetes.io/name: adla-minio
    app.kubernetes.io/component: storage
