# Out-of-band, ZERO-WRITE-LOCK build of the query-optimization indexes
# (migration 20260607000000_query_optimization_indexes) for a RUNNING
# environment whose tables already hold data (i.e. staging).
#
# Standalone manifest — intentionally NOT in kustomization.yaml; applied
# manually with `kubectl apply -n <namespace> -f`. `part-of: adla` is baked in
# so the NetworkPolicy admits the pod to reach Postgres.
#
# WHY: a plain `CREATE INDEX` (what `prisma migrate deploy` runs) takes a SHARE
# lock that blocks writes to the table while the index builds. `CREATE INDEX
# CONCURRENTLY` does not — but it cannot run inside a transaction, so it cannot
# live in the Prisma migration. This Job builds the indexes CONCURRENTLY via
# psql instead.
#
# COMPOSES WITH THE PIPELINE: migration 20260607000000 is idempotent (CREATE
# INDEX IF NOT EXISTS / DROP INDEX IF EXISTS). Run this Job FIRST; when the
# merge-to-main deploy later runs `prisma migrate deploy`, every statement is
# already satisfied, so the migration no-ops and records as applied with no
# further locking — no `prisma migrate resolve` or _prisma_migrations surgery.
#
# RUN (staging):
#   kubectl apply -n adla-staging -f k8s/base/optimization-indexes-job.yaml
#   kubectl -n adla-staging wait --for=condition=complete \
#     job/adla-optimization-indexes --timeout=1800s
#   kubectl -n adla-staging logs job/adla-optimization-indexes
#
# VERIFY no INVALID index was left by an interrupted CONCURRENTLY build:
#   kubectl -n adla-staging exec adla-postgres-0 -- \
#     psql -U adla-staging -d adla-staging -c \
#     "SELECT indexrelid::regclass AS invalid_index FROM pg_index WHERE NOT indisvalid;"
#
# RE-RUN: idempotent and safe to re-apply (delete the completed Job first:
#   kubectl -n adla-staging delete job adla-optimization-indexes --ignore-not-found).
# If it failed mid-build, first DROP any INVALID index reported above
# (DROP INDEX CONCURRENTLY "<name>";) — IF NOT EXISTS will not rebuild an
# existing-but-invalid index on its own.
#
# PRODUCTION: apply with `-n adla-production`. On an EMPTY prod DB this Job is
# unnecessary — index builds there are instant; just deploy normally.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adla-optimization-indexes-sql
  labels:
    app.kubernetes.io/name: adla-optimization-indexes
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: adla
data:
  indexes.sql: |
    -- Long builds must not hit a statement timeout; bound lock waits so a
    -- CONCURRENTLY build's brief metadata locks fail fast rather than queue
    -- behind a long-running transaction indefinitely.
    SET statement_timeout = 0;
    SET lock_timeout = '10s';

    \echo 'Creating new indexes CONCURRENTLY...'
    CREATE INDEX CONCURRENTLY IF NOT EXISTS "applicant_offices_profile_id_idx" ON "applicant_offices"("profile_id");
    CREATE INDEX CONCURRENTLY IF NOT EXISTS "applicant_offices_institution_id_idx" ON "applicant_offices"("institution_id");
    CREATE INDEX CONCURRENTLY IF NOT EXISTS "applicant_offices_office_category_id_idx" ON "applicant_offices"("office_category_id");
    CREATE INDEX CONCURRENTLY IF NOT EXISTS "reviews_declaration_id_idx" ON "reviews"("declaration_id");
    CREATE INDEX CONCURRENTLY IF NOT EXISTS "reviews_reviewed_by_idx" ON "reviews"("reviewed_by");
    CREATE INDEX CONCURRENTLY IF NOT EXISTS "receipts_declaration_id_idx" ON "receipts"("declaration_id");
    CREATE INDEX CONCURRENTLY IF NOT EXISTS "declarations_applicant_id_created_at_idx" ON "declarations"("applicant_id", "created_at");
    CREATE INDEX CONCURRENTLY IF NOT EXISTS "declarations_status_created_at_idx" ON "declarations"("status", "created_at");
    CREATE INDEX CONCURRENTLY IF NOT EXISTS "declarations_created_at_idx" ON "declarations"("created_at");
    CREATE INDEX CONCURRENTLY IF NOT EXISTS "applicant_profiles_verification_status_created_at_idx" ON "applicant_profiles"("verification_status", "created_at");

    \echo 'Dropping redundant / superseded indexes CONCURRENTLY...'
    DROP INDEX CONCURRENTLY IF EXISTS "declarations_unique_code_idx";
    DROP INDEX CONCURRENTLY IF EXISTS "declarations_status_idx";
    DROP INDEX CONCURRENTLY IF EXISTS "applicant_profiles_verification_status_idx";
    DROP INDEX CONCURRENTLY IF EXISTS "refresh_tokens_token_idx";
    DROP INDEX CONCURRENTLY IF EXISTS "password_reset_tokens_token_idx";
    DROP INDEX CONCURRENTLY IF EXISTS "email_verification_tokens_token_idx";

    \echo 'Done. Any rows below are INVALID indexes that need manual cleanup:'
    SELECT indexrelid::regclass AS invalid_index FROM pg_index WHERE NOT indisvalid;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: adla-optimization-indexes
  labels:
    app.kubernetes.io/name: adla-optimization-indexes
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: adla
spec:
  # CONCURRENTLY failures can leave an INVALID index; do not auto-retry blindly.
  # Re-apply manually after checking for / dropping any invalid index.
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adla-optimization-indexes
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: adla
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-alpine
          envFrom:
            # Supplies DATABASE_URL (and the rest); only DATABASE_URL is used.
            - secretRef:
                name: adla-secrets
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # libpq rejects Prisma's `?schema=public`; strip the query string.
              DB="${DATABASE_URL%%\?*}"
              echo "Connecting to Postgres for CONCURRENTLY index build..."
              psql "$DB" -v ON_ERROR_STOP=1 -f /sql/indexes.sql
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          resources:
            requests:
              cpu: 128m
              memory: 256Mi
            limits:
              cpu: 256m
              memory: 512Mi
      volumes:
        - name: sql
          configMap:
            name: adla-optimization-indexes-sql
