# Bootstrap-managed (NOT in kustomization). Applied once per namespace by a
# cluster admin: `kubectl apply -n <ns> -f k8s/base/limit-range.yaml`.
# Like ResourceQuota, LimitRange is a platform guardrail the namespace-scoped
# deploy identity cannot write by design.
apiVersion: v1
kind: LimitRange
metadata:
  name: adla-limits
  labels:
    app.kubernetes.io/part-of: adla
    app.kubernetes.io/component: infra
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 128m
        memory: 256Mi
      max:
        cpu: "2"
        memory: 2Gi
