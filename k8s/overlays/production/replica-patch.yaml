apiVersion: apps/v1
kind: Deployment
metadata:
  name: adla-app
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adla-worker
spec:
  replicas: 2
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adla-app
spec:
  minReplicas: 2
  maxReplicas: 5
