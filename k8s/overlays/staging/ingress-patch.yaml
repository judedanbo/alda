apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adla-ingress
  annotations:
    cert-manager.io/cluster-issuer: infosys-issuer
spec:
  tls:
    # host and tls host must match for cert-manager.
    - hosts:
        - staging-alda.audit.gov.gh
      secretName: adla-staging-tls
  rules:
    - host: staging-alda.audit.gov.gh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adla-app
                port:
                  number: 3000
