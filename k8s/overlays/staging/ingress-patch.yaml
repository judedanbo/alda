apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adla-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  tls:
    - hosts:
        - staging.adla.gov.gh
      secretName: adla-staging-tls
  rules:
    - host: staging.adla.gov.gh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adla-app
                port:
                  number: 3000
