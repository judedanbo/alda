name: CI

on:
  # Runs on PRs (gates merge) and via workflow_call from the Deploy workflow
  # (gates the deploy). No push trigger — pushing to main runs Deploy, which
  # invokes this workflow as its first job, so CI runs exactly once per merge.
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    # Postgres for the integration test tier (real-DB SQL/decrypt/index checks).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adla
          POSTGRES_PASSWORD: adla
          POSTGRES_DB: adla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adla"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # L-6: actions pinned to full commit SHAs. The trailing comment
      # records the human-readable version; bump the SHA when upgrading.
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci (not install): fails the build on a lockfile out of sync with
      # package.json, so a desync is caught here instead of leaking to Deploy.
      - run: npm ci

      - run: npx nuxi prepare

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx nuxi typecheck

      - name: Unit tests
        run: npm run test:unit

      # Real-DB tier: apply migrations to the service Postgres, then run the
      # integration suite (SQL aggregates, decryption, index existence).
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql://adla:adla@localhost:5432/adla_test
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
          npm run test:integration

      - name: Build
        run: npm run build
