name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm install

      - run: npx nuxi prepare

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx nuxi typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
