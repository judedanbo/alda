name: Deploy

on:
  push:
    branches: [main, develop]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: regisry
  AKS_CLUSTER: infosys
  RESOURCE_GROUP: infosys

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      overlay: ${{ steps.env.outputs.overlay }}
      namespace: ${{ steps.env.outputs.namespace }}
      domain: ${{ steps.env.outputs.domain }}
    steps:
      - id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "overlay=production" >> "$GITHUB_OUTPUT"
            echo "namespace=adla-production" >> "$GITHUB_OUTPUT"
            echo "domain=alda.audit.gov.gh" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "overlay=staging" >> "$GITHUB_OUTPUT"
            echo "namespace=adla-staging" >> "$GITHUB_OUTPUT"
            # TEMPORARY: typo'd staging host until DNS is corrected to staging-alda.*
            echo "domain=ttaging-alda.audit.gov.gh" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: [ci, set-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push app image
        run: |
          docker build \
            -f app/docker/Dockerfile \
            --target production \
            -t ${{ env.ACR_NAME }}.azurecr.io/adla-app:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/adla-app:${{ needs.set-env.outputs.overlay }}-latest \
            app/
          docker push ${{ env.ACR_NAME }}.azurecr.io/adla-app --all-tags

      - name: Build and push migration image
        run: |
          docker build \
            -f app/docker/Dockerfile \
            --target migration \
            -t ${{ env.ACR_NAME }}.azurecr.io/adla-migrate:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/adla-migrate:${{ needs.set-env.outputs.overlay }}-latest \
            app/
          docker push ${{ env.ACR_NAME }}.azurecr.io/adla-migrate --all-tags

  deploy-data-tier:
    needs: [build-and-push, set-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      - name: Apply data tier + shared config, wait for readiness
        run: |
          NAMESPACE="${{ needs.set-env.outputs.namespace }}"
          OVERLAY="${{ needs.set-env.outputs.overlay }}"

          # Render once; apply only the data tier (database/cache/storage) and
          # shared infra (configmap/netpol/quota/limitrange/namespace) so the
          # app/worker are NOT rolled to the new image until AFTER migrations.
          kustomize build "k8s/overlays/$OVERLAY" > /tmp/manifests.yaml
          kubectl apply -f /tmp/manifests.yaml \
            -l 'app.kubernetes.io/component in (database,cache,storage,infra)'

          # Gate: Postgres must be Ready before the migration job runs.
          kubectl rollout status statefulset/adla-postgres -n "$NAMESPACE" --timeout=300s
          kubectl rollout status statefulset/adla-redis -n "$NAMESPACE" --timeout=300s
          kubectl rollout status statefulset/adla-minio -n "$NAMESPACE" --timeout=300s
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=adla-postgres \
            -n "$NAMESPACE" --timeout=300s

  migrate:
    needs: [deploy-data-tier, set-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      - name: Run migration Job
        run: |
          NAMESPACE="${{ needs.set-env.outputs.namespace }}"
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/adla-migrate:${{ github.sha }}"
          JOB_NAME="adla-migrate-${{ github.run_number }}"

          # Delete previous migration job if it exists
          kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --ignore-not-found

          # Apply migration job with envFrom so it receives DATABASE_URL
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $JOB_NAME
            namespace: $NAMESPACE
            labels:
              app.kubernetes.io/part-of: adla
              app.kubernetes.io/component: migration
          spec:
            backoffLimit: 3
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app.kubernetes.io/part-of: adla
                  app.kubernetes.io/component: migration
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: $IMAGE
                    command: ["npx", "prisma", "migrate", "deploy"]
                    envFrom:
                      - configMapRef:
                          name: adla-config
                      - secretRef:
                          name: adla-secrets
                    resources:
                      requests:
                        cpu: 128m
                        memory: 256Mi
                      limits:
                        cpu: 256m
                        memory: 512Mi
          EOF

          # Wait for the job to complete (timeout 5 minutes)
          kubectl wait --for=condition=complete \
            --timeout=300s \
            "job/$JOB_NAME" \
            -n "$NAMESPACE"

  deploy-app:
    needs: [migrate, set-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      - name: Deploy with Kustomize
        run: |
          OVERLAY="${{ needs.set-env.outputs.overlay }}"

          # Set the image tag to the current commit SHA
          cd k8s/overlays/$OVERLAY
          kustomize edit set image \
            regisry.azurecr.io/adla-app=regisry.azurecr.io/adla-app:${{ github.sha }} \
            regisry.azurecr.io/adla-migrate=regisry.azurecr.io/adla-migrate:${{ github.sha }}
          cd -

          # Apply the full overlay (app/worker/hpa/ingress + idempotent data tier).
          # Runs AFTER migrations so the app rolls onto a migrated database.
          kustomize build k8s/overlays/$OVERLAY | kubectl apply -f -

          # Discard the image tag mutation so the checkout stays clean
          git checkout -- k8s/overlays/$OVERLAY/kustomization.yaml

      - name: Wait for rollout
        run: |
          NAMESPACE="${{ needs.set-env.outputs.namespace }}"
          kubectl rollout status deployment/adla-app -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/adla-worker -n "$NAMESPACE" --timeout=300s

  smoke-test:
    needs: [deploy-app, set-env]
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          DOMAIN="${{ needs.set-env.outputs.domain }}"
          echo "Waiting 30s for ingress to stabilize..."
          sleep 30

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}/api/health" --max-time 30 || true)

          if [ "$STATUS" = "200" ]; then
            echo "Health check passed (HTTP $STATUS)"
          else
            echo "WARNING: Health check returned HTTP $STATUS (may need DNS propagation)"
            echo "This is expected on first deploy before DNS is configured."
          fi
